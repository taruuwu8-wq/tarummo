<!doctype html>
<html lang="th">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
  <title>Nostaru</title>
  <style>
    :root { --bg: #1b1f2a; --panel: rgba(20, 24, 36, 0.82); --line: #3a4260; --fg: #e8ecf5; --muted: #9aa3bd; --hp: #e5484d; --mp: #4f8cff; --xp: #9be7ff; --gold: #ffd23f; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: var(--bg); color: var(--fg); overflow: hidden; font-family: system-ui, sans-serif; }
    [hidden] { display: none !important; }
    #game { position: fixed; inset: 0; }
    #hud { position: fixed; inset: 0; pointer-events: none; z-index: 5; font-size: 12px; }
    .frame { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); width: 210px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 8px; display: grid; gap: 4px; }
    .frame.target { left: auto; right: calc(10px + env(safe-area-inset-right, 0px)); width: 190px; }
    .name { font-weight: 700; }
    .bar { position: relative; height: 12px; background: #0c0f18; border-radius: 3px; overflow: hidden; }
    .bar.mp { height: 11px; }
    .bar.mp span { line-height: 11px; font-size: 9px; }
    .bar i { position: absolute; inset: 0 auto 0 0; background: var(--hp); transition: width .15s; }
    .bar.mp i { background: var(--mp); }
    .frame:not(.target) .bar.hp i { background: #4fc96b; }
    .bar span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 12px; font-variant-numeric: tabular-nums; }
    .xp { position: absolute; left: 0; right: 0; bottom: env(safe-area-inset-bottom, 0px); height: 14px; background: #0c0f18; }
    .xp i { position: absolute; inset: 0 auto 0 0; background: var(--xp); opacity: .7; transition: width .2s; }
    .xp u { position: absolute; top: 0; bottom: 0; background: #b18cff; opacity: .55; text-decoration: none; }
    .xp span { position: relative; display: block; text-align: center; font-size: 10px; line-height: 14px; font-variant-numeric: tabular-nums; }
    .gold { color: var(--gold); font-weight: 700; font-variant-numeric: tabular-nums; }
    #bar { pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); display: flex; gap: 6px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .sk { position: relative; width: 48px; height: 48px; padding: 0; overflow: hidden; color: var(--fg); background: #0f1320; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: 700 11px system-ui, sans-serif; }
    .sk .ic { font-size: 22px; line-height: 48px; }
    .sk .key { position: absolute; left: 3px; top: 1px; font-size: 10px; color: var(--muted); }
    .sk .mpc { position: absolute; right: 3px; bottom: 1px; font-size: 10px; color: #7fb2ff; font-variant-numeric: tabular-nums; }
    .sk .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.6); pointer-events: none; }
    .sk.nomp .ic { opacity: .35; }
    .sk.queued { border-color: var(--gold); }
    .sk.wide { width: 56px; }
    #auto.on { color: #1b1f2a; background: var(--gold); border-color: var(--gold); }
    .sk:focus-visible, #classes button:focus-visible, #bag button:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #toasts { position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(90px + env(safe-area-inset-bottom, 0px)); display: flex; flex-direction: column-reverse; align-items: center; gap: 4px; }
    .toast { padding: 4px 10px; background: var(--panel); border: 1px solid var(--line); border-radius: 999px; font-size: 12px; animation: tin .2s ease-out; }
    .toast.uncommon { color: #6ff08f; } .toast.rare { color: #6fb6ff; } .toast.epic { color: #d08bff; } .toast.warn { color: #ffb36b; } .toast.muted { color: var(--muted); }
    @keyframes tin { from { opacity: 0; transform: translateY(6px); } }
    #bag { pointer-events: auto; position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); top: calc(80px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 20px)); max-height: calc(100% - 190px); overflow-y: auto; display: flex; flex-direction: column; gap: 10px; padding: 12px; background: rgba(20,24,36,.95); border: 1px solid var(--line); border-radius: 12px; }
    #bag > * { flex-shrink: 0; }
    #bag button { font: inherit; color: var(--fg); cursor: pointer; }
    .bag-head { display: flex; justify-content: space-between; align-items: center; }
    .bag-head button { background: none; border: 0; font-size: 16px; }
    .equip { display: grid; grid-template-columns: repeat(6, 1fr); gap: 6px; }
    .gearset { display: flex; flex-wrap: wrap; align-items: center; gap: 4px 8px; margin: 4px 0; font-size: 11px; }
    .gearset .cmp { display: flex; flex-direction: column; flex: 1 1 100%; order: 2; }
    .gearset em.up { color: #6f6; font-style: normal; } .gearset em.dn { color: #f77; font-style: normal; }
    .slot { display: grid; justify-items: center; gap: 2px; padding: 6px 2px; background: #0f1320; border: 1px solid var(--line); border-radius: 8px; }
    .slot .ic { font-size: 22px; height: 26px; } .slot small { font-size: 10px; color: var(--muted); }
    .stats { display: flex; flex-wrap: wrap; gap: 4px 10px; font-size: 11px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .tabs { display: flex; gap: 4px; }
    .tabs { flex-wrap: wrap; } .tabs button { flex: 1 0 30%; padding: 6px; font-size: 12px; background: #0f1320; border: 1px solid var(--line); border-radius: 6px; }
    .tabs button.on { border-color: var(--gold); color: var(--gold); }
    .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; min-height: 48px; }
    .cell { position: relative; aspect-ratio: 1; max-width: 100%; padding: 0; background: #0f1320; border: 1px solid var(--line); border-radius: 6px; font-size: 20px; }
    .cell b { position: absolute; right: 2px; bottom: 0; font-size: 10px; }
    .cell em, .slot em { position: absolute; left: 2px; top: 0; font: 700 9px system-ui, sans-serif; font-style: normal; color: var(--gold); }
    .slot { position: relative; } .slot.sel { outline: 2px solid var(--gold); }
    #tf-btn.on { border-color: var(--gold); box-shadow: 0 0 10px var(--gold) inset; }
    #skills { display: contents; }
    .cell.sel { outline: 2px solid var(--gold); }
    .count { grid-column: 1 / -1; text-align: right; font-size: 10px; color: var(--muted); }
    .common { border-color: #4a526e; } .uncommon { border-color: #3fae5e; } .rare { border-color: #3f7fd6; } .epic { border-color: #9a5fd6; }
    .uncommon-t { color: #6ff08f; } .rare-t { color: #6fb6ff; } .epic-t { color: #d08bff; }
    .detail { display: grid; gap: 6px; font-size: 12px; min-height: 40px; }
    .muted { color: var(--muted); }
    .acts { display: flex; gap: 6px; }
    .acts button { padding: 6px 12px; background: #0f1320; border: 1px solid var(--line); border-radius: 6px; }
    .acts button:first-child { border-color: var(--gold); }
    .autosell { display: flex; gap: 6px; align-items: center; font-size: 11px; color: var(--muted); }
    #npc { pointer-events: auto; position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(110px + env(safe-area-inset-top, 0px)); width: min(340px, calc(100vw - 20px)); max-height: calc(100% - 210px); overflow-y: auto; display: flex; flex-direction: column; gap: 8px; padding: 12px; background: rgba(20,24,36,.95); border: 1px solid var(--gold); border-radius: 12px; }
    #npc > * { flex-shrink: 0; margin: 0; }
    #npc button { font: inherit; color: var(--fg); cursor: pointer; padding: 5px 10px; background: #0f1320; border: 1px solid var(--line); border-radius: 6px; }
    #npc button:disabled { opacity: .4; cursor: default; }
    #npc .bag-head button { background: none; border: 0; }
    #npc .greet { color: var(--muted); font-style: italic; }
    #npc .rows { display: flex; flex-direction: column; gap: 6px; }
    #npc .row { display: flex; align-items: center; gap: 8px; padding: 6px; background: #0f1320; border-radius: 8px; }
    #npc .row .ic { font-size: 20px; width: 26px; text-align: center; }
    #npc .row .nm { flex: 1; min-width: 0; font-size: 12px; }
    #npc .row .pr { color: var(--gold); font-variant-numeric: tabular-nums; font-size: 12px; }
    #npc .big { padding: 12px; border-color: var(--gold); }
    #npc .small { font-size: 11px; }
    #banner { position: absolute; left: 0; right: 0; top: calc(64px + env(safe-area-inset-top, 0px)); text-align: center; font-size: 22px; font-weight: 800; text-shadow: 0 2px 4px #000, 0 0 2px #000; opacity: 0; }
    #banner.show { animation: ban 2.4s ease-out; }
    @keyframes ban { 0% { opacity: 0; transform: translateY(8px); } 12%, 70% { opacity: 1; transform: none; } 100% { opacity: 0; } }
    #chat { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); bottom: calc(92px + env(safe-area-inset-bottom, 0px)); width: min(300px, 40vw); display: grid; gap: 4px; pointer-events: none; }
    #chatlog { display: grid; gap: 2px; font-size: 12px; text-shadow: 0 1px 2px #000, 0 0 2px #000; }
    #chatlog b { color: #9be7ff; } #chatlog b.me { color: var(--gold); }
    #chatin { pointer-events: auto; padding: 6px 8px; font: inherit; font-size: 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 6px; }
    #chatin:focus-visible { outline: 2px solid var(--gold); }
    #npc .grid { display: grid; grid-template-columns: repeat(6, 1fr); gap: 5px; }
    #npc .grid .cell { position: relative; aspect-ratio: 1; padding: 0; font-size: 18px; }
    #npc .cell b { position: absolute; right: 2px; bottom: 0; font-size: 10px; }
    #mountbtn.on { border-color: #9be7ff; box-shadow: 0 0 10px #9be7ff inset; }
    #dg { position: absolute; left: 50%; transform: translateX(-50%); top: calc(12px + env(safe-area-inset-top, 0px)); padding: 6px 14px; background: var(--panel); border: 1px solid #ff8a5b; border-radius: 999px; font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
    @media (max-width: 600px) { #dg { top: auto; bottom: calc(150px + env(safe-area-inset-bottom, 0px)); font-size: 11px; } }
    #bar { gap: 4px; }
    #bar .sk.empty { opacity: .45; border-style: dashed; }
    .sk .mpc.qty { color: var(--fg); }
    #side { pointer-events: auto; position: absolute; right: calc(10px + env(safe-area-inset-right, 0px)); bottom: calc(22px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(2, 48px); gap: 6px; padding: 6px; background: var(--panel); border: 1px solid var(--line); border-radius: 12px; }
    .sb { position: relative; width: 48px; height: 48px; padding: 0; overflow: hidden; color: var(--fg); background: #0f1320; border: 1px solid var(--line); border-radius: 8px; cursor: pointer; font: 700 11px system-ui, sans-serif; }
    .sb .ic { font-size: 22px; line-height: 48px; } .sb .key { position: absolute; left: 3px; top: 1px; font-size: 10px; color: var(--muted); }
    .sb .cd { position: absolute; left: 0; right: 0; bottom: 0; height: 0; background: rgba(0,0,0,.6); pointer-events: none; }
    .sb.wide { grid-column: span 2; width: auto; height: 40px; }
    .sb.nomp .ic { opacity: .35; } .sb:focus-visible { outline: 2px solid var(--gold); outline-offset: 2px; }
    #tf-btn.on { border-color: var(--gold); box-shadow: 0 0 10px var(--gold) inset; }
    .panel { pointer-events: auto; position: absolute; left: 50%; transform: translateX(-50%); bottom: calc(86px + env(safe-area-inset-bottom, 0px)); width: min(380px, calc(100vw - 20px)); max-height: calc(100% - 200px); overflow-y: auto; display: flex; flex-direction: column; gap: 6px; padding: 12px; background: rgba(20,24,36,.96); border: 1px solid var(--line); border-radius: 12px; }
    .panel > * { flex-shrink: 0; } .panel p { margin: 0; }
    .panel button { font: inherit; color: var(--fg); cursor: pointer; }
    .panel .bag-head button { background: none; border: 0; }
    #skillbody, #cardbody { display: flex; flex-direction: column; gap: 6px; }
    .srow, .crow { display: flex; align-items: center; gap: 10px; padding: 6px; background: #0f1320; border: 1px solid var(--line); border-radius: 8px; text-align: left; }
    .crow.cur { border-color: var(--gold); }
    .srow.locked { opacity: .5; }
    .sic { width: 40px; height: 40px; flex-shrink: 0; display: grid; place-items: center; font-size: 22px; background: #1a2033; border-radius: 8px; touch-action: none; }
    [data-drag] { cursor: grab; outline: 1px dashed #4a526e; }
    .snm { display: grid; min-width: 0; } .snm small { color: var(--muted); font-size: 11px; }
    .uses { display: flex; gap: 6px; flex-wrap: wrap; }
    .ghost { position: fixed; z-index: 50; transform: translate(-50%, -50%); font-size: 28px; pointer-events: none; filter: drop-shadow(0 2px 4px #000); }
    #bar .sk { touch-action: none; }
    .sb.busy .ic { opacity: .4; }
    #autocfg { left: auto; right: calc(10px + env(safe-area-inset-right, 0px)); transform: none; bottom: calc(200px + env(safe-area-inset-bottom, 0px)); width: min(340px, calc(100vw - 20px)); }
    #autocfg fieldset { border: 1px solid var(--line); border-radius: 8px; padding: 6px 8px; margin: 0; display: grid; gap: 4px; }
    #autocfg legend { color: var(--gold); font-size: 12px; padding: 0 4px; }
    #autocfg .row2 { display: flex; justify-content: space-between; align-items: center; gap: 8px; font-size: 12px; flex-wrap: wrap; }
    #autocfg .row2 input[type=range] { width: 100%; }
    #autocfg .chk { display: flex; gap: 6px; align-items: center; font-size: 12px; }
    #autocfg input[type=number] { width: 54px; padding: 3px 4px; font: inherit; color: var(--fg); background: #0f1320; border: 1px solid var(--line); border-radius: 4px; }
    #autocfg select { padding: 3px 4px; font: inherit; font-size: 12px; color: var(--fg); background: #0f1320; border: 1px solid var(--line); border-radius: 4px; }
    #autosum { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(104px + env(safe-area-inset-top, 0px)); width: 210px; padding: 6px 8px; font-size: 11px; line-height: 1.5; background: var(--panel); border: 1px solid var(--gold); border-radius: 8px; font-variant-numeric: tabular-nums; }
    #autosum b { color: var(--gold); }
    .opt { font-size: 12px; } .opt b { display: inline-block; width: 14px; }
    .tg { display: flex; flex-wrap: wrap; gap: 6px; }
    .tg button { padding: 5px 8px; font: inherit; font-size: 12px; color: var(--fg); background: #0f1320; border: 1px solid var(--gold); border-radius: 6px; cursor: pointer; }
    #npc .chk { display: flex; gap: 6px; align-items: center; font-size: 12px; }
    .warn-t { color: #ff8a5b; }
    #npc button.armed { border-color: #ff5d5d; background: #3a1416; color: #ffd0d0; animation: arm .6s ease-in-out infinite alternate; }
    @keyframes arm { to { box-shadow: 0 0 10px #ff5d5d; } }
    .mobile-only { display: none; }
    /* phones: hotbar 2x5 bottom-left, system buttons 3 columns bottom-right, panels as bottom sheets, chat behind a button */
    @media (max-width: 760px) {
      .mobile-only { display: block; }
      #bar { left: calc(6px + env(safe-area-inset-left, 0px)); transform: none; bottom: calc(18px + env(safe-area-inset-bottom, 0px)); display: grid; grid-template-columns: repeat(5, 38px); gap: 3px; padding: 4px; }
      #bar .sk { width: 38px; height: 38px; } #bar .sk .ic { font-size: 17px; line-height: 38px; }
      #side { right: calc(6px + env(safe-area-inset-right, 0px)); bottom: calc(18px + env(safe-area-inset-bottom, 0px)); grid-template-columns: repeat(4, 36px); gap: 3px; padding: 4px; }
      .sb { width: 36px; height: 36px; } .sb .ic { font-size: 16px; line-height: 36px; } .sb .key { display: none; }
      .sb.wide { grid-column: span 4; height: 30px; font-size: 11px; }
      #chat { bottom: calc(112px + env(safe-area-inset-bottom, 0px)) !important; left: calc(6px + env(safe-area-inset-left, 0px)); width: 60vw; }
      #chatlog { font-size: 11px; } #chatlog div:nth-last-child(n+4) { display: none; }
      #chatin { display: none; } #chat.open #chatin { display: block; }
      #toasts { bottom: calc(150px + env(safe-area-inset-bottom, 0px)); }
      .frame { width: 150px; padding: 6px; } .frame.target { width: 140px; }
      #quest { width: 150px; top: calc(86px + env(safe-area-inset-top, 0px)); font-size: 10px; }
      #autosum { top: calc(10px + env(safe-area-inset-top, 0px)) !important; }
      #autosum { left: auto; right: calc(6px + env(safe-area-inset-right, 0px)); top: calc(10px + env(safe-area-inset-top, 0px)); width: 150px; font-size: 10px; }
      .frame.target { top: calc(170px + env(safe-area-inset-top, 0px)); left: calc(10px + env(safe-area-inset-left, 0px)); right: auto; }
      #bag, #npc, .panel, #autocfg { left: 6px; right: 6px; transform: none; width: auto; top: auto; bottom: calc(134px + env(safe-area-inset-bottom, 0px)); max-height: 52%; }
      .equip { grid-template-columns: repeat(7, 1fr); gap: 4px; } .slot small { font-size: 8px; }
    }
    #bag.selling > :not(.bag-head):not(#sellbox) { display: none; }
    .pill { margin-right: 8px; padding: 4px 10px !important; font-size: 12px !important; background: #0f1320 !important; border: 1px solid var(--gold) !important; border-radius: 999px; }
    #sellbox { display: flex; flex-direction: column; gap: 6px; }
    .sellf { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; font-size: 12px; }
    .chip { display: inline-flex; gap: 4px; align-items: center; padding: 3px 8px; background: #0f1320; border: 1px solid var(--line); border-radius: 999px; }
    .sellf select { font: inherit; color: var(--fg); background: #0f1320; border: 1px solid var(--line); border-radius: 4px; }
    .selll { display: flex; flex-direction: column; gap: 3px; max-height: 40vh; overflow-y: auto; }
    .sellrow { display: flex; gap: 8px; align-items: center; padding: 4px 6px; background: #0f1320; border-radius: 6px; font-size: 12px; }
    .sellrow span { flex: 1; min-width: 0; } .sellrow b { color: var(--gold); font-variant-numeric: tabular-nums; }
    #sell-go { padding: 10px; border: 1px solid var(--gold); border-radius: 8px; background: #0f1320; }
    #sell-go:disabled { opacity: .4; }
    #sell-go.armed { border-color: #ff5d5d; background: #3a1416; color: #ffd0d0; }
    #quest { position: absolute; left: calc(10px + env(safe-area-inset-left, 0px)); top: calc(104px + env(safe-area-inset-top, 0px)); width: 210px; display: grid; gap: 3px; padding: 6px 8px; font-size: 11px; background: var(--panel); border: 1px solid var(--line); border-radius: 8px; pointer-events: auto; }
    #quest button { padding: 4px; font: 700 11px system-ui, sans-serif; color: var(--fg); background: #0f1320; border: 1px solid #6fb6ff; border-radius: 6px; cursor: pointer; }
    #quest button.on { background: #6fb6ff; color: #1b1f2a; }
    #autosum { top: calc(186px + env(safe-area-inset-top, 0px)) !important; }
    .frame.target { top: calc(10px + env(safe-area-inset-top, 0px)); }
    #pick { position: fixed; inset: 0; z-index: 10; display: grid; place-content: center; gap: 16px; padding: 16px; text-align: center; background: radial-gradient(circle at 50% 40%, #2a3350, var(--bg)); }
    #pick h1 { margin: 0; font-size: 28px; letter-spacing: .04em; }
    #pick p { margin: 0; color: var(--muted); }
    #classes { display: flex; flex-wrap: wrap; justify-content: center; gap: 12px; }
    #pick .continue { justify-self: center; width: 220px; display: grid; justify-items: center; gap: 4px; padding: 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--gold); border-radius: 10px; cursor: pointer; font: inherit; }
    #pick .continue img { height: 64px; }
    #classes button { width: 140px; display: grid; justify-items: center; gap: 4px; padding: 12px 8px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 10px; cursor: pointer; font: inherit; }
    #classes button:hover { border-color: var(--gold); }
    #classes img { height: 80px; image-rendering: auto; }
    .login { display: grid; gap: 8px; justify-items: center; }
    .login input { width: min(260px, 80vw); padding: 10px 12px; font: inherit; font-size: 16px; color: var(--fg); background: var(--panel); border: 1px solid var(--line); border-radius: 8px; text-align: center; }
    .login input:focus-visible { outline: 2px solid var(--gold); }
    .login .err { min-height: 1em; color: #ffb36b; font-size: 12px; }
    .login .saved { display: flex; flex-wrap: wrap; gap: 6px; justify-content: center; }
    .login .saved button { padding: 6px 10px; font: inherit; font-size: 12px; color: var(--fg); background: var(--panel); border: 1px solid var(--gold); border-radius: 999px; cursor: pointer; }
    #pick .hint { font-size: 11px; }
    #pick small { color: var(--muted); font-size: 11px; }
  </style>
</head>
<body>
  <div id="game"></div>
  <div id="hud"></div>
  <div id="pick">
    <h1>Nostaru</h1>
    <p>เลือกอาชีพ</p>
    <div id="classes"></div>
  </div>
  <script type="module" src="/src/main.ts"></script>
</body>
</html>
